<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hiprobuild Estimator</title>
<meta name="theme-color" content="#1E2B39">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hiprobuild"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: sidebar app shell; editor = form column + live A4 paper with a drawing-style title block */
:root{
  --accent-l:#3C78AC; --accent-d:#86BDEB; --metal-l:#9AA6B3; --metal-d:#6F7B88;
  --band:#1E2B39; --band-hi:#9CCBF0; --paper-accent:#3C78AC;
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:#D8DDE4; --fg:#111820; --muted:#5B6673;
  --accent:var(--accent-l); --metal:var(--metal-l); --accent-ink:#FFFFFF;
  --good:#1D7448; --good-bg:#E2F2E9; --warn:#9A6200; --warn-bg:#FBEFD8; --bad:#AE3329; --bad-bg:#F8E3E1; --info-bg:#E6EEF6;
  --paper:#FFFFFF; --paper-ink:#14181D; --paper-muted:#5C6570; --paper-line:#D6DBE1; --paper-soft:#F3F5F7;
  --shadow:0 1px 2px rgba(17,24,32,.06),0 8px 24px rgba(17,24,32,.06);
  --logo-filter:invert(1) brightness(.12);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-brand="gold"]{ --accent-l:#94722F; --accent-d:#D4B066; --metal-l:#B9A27A; --metal-d:#8A7550; --band:#0D0D0D; --band-hi:#D4B066; --paper-accent:#8E6C2A; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1115; --surface:#151A20; --surface-2:#1B2129; --line:#2A323C; --fg:#E6EBF0; --muted:#94A1AF;
  --accent:var(--accent-d); --metal:var(--metal-d); --accent-ink:#0D1115;
  --good:#5CC48D; --good-bg:#16291F; --warn:#E3AE4F; --warn-bg:#2B2213; --bad:#EE8277; --bad-bg:#2E1A18; --info-bg:#18232F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --logo-filter:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1115; --surface:#151A20; --surface-2:#1B2129; --line:#2A323C; --fg:#E6EBF0; --muted:#94A1AF;
  --accent:var(--accent-d); --metal:var(--metal-d); --accent-ink:#0D1115;
  --good:#5CC48D; --good-bg:#16291F; --warn:#E3AE4F; --warn-bg:#2B2213; --bad:#EE8277; --bad-bg:#2E1A18; --info-bg:#18232F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --logo-filter:none; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.mark{display:flex;flex-direction:column;gap:8px}
.logo-app{display:block;width:118px;height:auto;filter:var(--logo-filter)}
.mark b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.14em}
.mark span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.mark i{display:block;height:3px;width:44px;background:linear-gradient(90deg,var(--accent),var(--metal));margin-top:8px;border-radius:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--info-bg);color:var(--fg)}
.nav svg{width:17px;height:17px;flex:none}
.side .cta{margin-top:auto}
.syncline{margin-top:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.syncline::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--metal)}
.syncline:has([data-state="ok"])::before{background:var(--good)}
.syncline:has([data-state="err"])::before,.syncline:has([data-state="off"])::before{background:var(--warn)}
.syncline+.cta{margin-top:0}
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--band)}
.login form{width:min(380px,100%);background:var(--surface);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login .lg-logo{display:block;height:96px;width:auto;margin:0 auto 6px;filter:var(--logo-filter)}
.login h1{font-size:20px;text-align:center;margin:0}
.login p.sub{text-align:center;margin:0}
.login .err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px;font-size:13px}
.nav .mnew{display:none}
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0;letter-spacing:.01em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--metal)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:20px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--band);border-color:var(--band);color:#F2F5F8}
.kpi.lead .l,.kpi.lead .s{color:#AEB8C3}
.kpi.lead .v{color:var(--band-hi)}

.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:640px}
.list th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.list td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:var(--surface-2)}
.list .r{text-align:right}
.who{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{color:var(--muted);max-width:44ch;margin:0}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:22px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,.items input,.items select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.items input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) 66px 70px 92px 96px 30px;gap:6px;align-items:center}
.it.h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.it .amt{text-align:right;font-family:var(--f-mono);font-size:13px}
.it .desc{display:flex;flex-direction:column;gap:4px}
.it .desc input.secin{font-size:11.5px;padding:4px 8px;color:var(--muted)}
.it input.n{text-align:right;font-family:var(--f-mono)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:6px}
.x:hover{background:var(--bad-bg);color:var(--bad)}
.totbox{display:flex;flex-direction:column;gap:6px;align-self:flex-end;min-width:260px}
.totbox div{display:flex;justify-content:space-between;gap:24px}
.totbox .big{font-family:var(--f-display);font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:8px}
.tpl{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed var(--metal);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.stickyp{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.pv{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden}
.scaler{transform-origin:top left}
.tabs-m{display:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;box-shadow:var(--shadow)}
.saving{font-size:12px;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.picker{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.picker .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 4px 4px}
.picker button{display:flex;justify-content:space-between;gap:12px;border:1px solid transparent;background:var(--surface-2);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left}
.picker button:hover{border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rates .it{grid-template-columns:150px minmax(0,1fr) 80px 100px 30px}
.swatch{display:flex;gap:12px;flex-wrap:wrap}
.sw{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--surface);display:flex;gap:10px;align-items:center;font-weight:600}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw i{display:block;width:34px;height:34px;border-radius:8px}

/* paper (always a white A4 sheet) */
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column}
.p-band{background:var(--band);color:#F2F4F6;padding:34px 44px 28px;display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:flex-end;gap:20px}
.p-word{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.p-logo{display:block;height:92px;width:auto}
.p-word b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.16em;line-height:1}
.p-word span{display:block;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#AEB8C3;margin-top:8px}
.p-word em{display:block;font-style:normal;font-size:11px;color:var(--band-hi);margin-top:12px;letter-spacing:.02em}
.p-type{text-align:left}
.p-type b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.2em;color:var(--band-hi)}
.p-type span{font-family:var(--f-mono);font-size:12px;color:#C9D1D9}
.p-rule{height:4px;background:linear-gradient(90deg,var(--band-hi),var(--metal-l) 60%,var(--paper-line))}
.p-body{padding:28px 44px 24px;display:flex;flex-direction:column;gap:20px;flex:1}
.tb{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--paper-ink)}
.tb>div{padding:8px 10px;border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line)}
.tb>div:nth-child(4n){border-right:0}
.tb .s2{grid-column:span 2}
.tb .s4{grid-column:span 4;border-right:0}
.tb .last{border-bottom:0}
.tb small{display:block;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-muted);font-weight:600;margin-bottom:2px}
.tb p{margin:0;white-space:pre-line}
.tb .strong{font-weight:600}
.p-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
table.p-items{width:100%;border-collapse:collapse}
.p-items th{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-muted);text-align:left;padding:0 6px 7px;border-bottom:1.5px solid var(--paper-ink);font-weight:600}
.p-items td{padding:7px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.p-items .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.p-items tr.grp td{background:var(--paper-soft);font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--paper-accent);padding:6px 6px 5px;border-bottom:0}
.p-items tr.grp td span{float:right;font-family:var(--f-mono);letter-spacing:0;color:var(--paper-muted);font-weight:500}
.p-split{display:grid;grid-template-columns:1fr 280px;gap:28px;align-items:start}
.p-tot div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--paper-line);font-variant-numeric:tabular-nums}
.p-tot div span:last-child{font-family:var(--f-mono)}
.p-tot .grand{border-bottom:0;margin-top:6px;padding:11px 12px;background:var(--band);color:#F2F4F6;font-weight:700;font-size:14px}
.p-tot .grand span:last-child{color:var(--band-hi)}
.p-tot .due{border-bottom:0;padding:8px 12px;border:1.5px solid var(--paper-ink);margin-top:8px;font-weight:700}
.p-h{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--paper-accent);margin:0 0 5px}
.p-txt{margin:0;white-space:pre-line;color:var(--paper-ink)}
.p-small{font-size:10.5px;color:var(--paper-muted);white-space:pre-line;margin:0}
.p-sign{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:6px}
.p-sign div{border-bottom:1px solid var(--paper-ink);height:38px;position:relative}
.p-sign div span{position:absolute;bottom:-17px;left:0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted)}
.p-paid{display:flex;gap:18px;align-items:center;border:1.5px solid var(--paper-ink);padding:16px 18px}
.p-paid b{font-family:var(--f-display);font-size:28px;letter-spacing:.02em}
.stamp{font-family:var(--f-display);font-weight:800;letter-spacing:.24em;font-size:15px;color:var(--paper-accent);border:2.5px solid var(--paper-accent);padding:6px 12px;transform:rotate(-4deg);display:inline-block}
.p-foot{padding:14px 44px 22px;border-top:1px solid var(--paper-line);display:flex;justify-content:space-between;gap:16px;font-size:9.5px;color:var(--paper-muted)}
.p-foot b{color:var(--paper-ink)}
.ex-flag{font-family:var(--f-mono);font-size:10px;background:var(--warn-bg);color:var(--warn);padding:2px 6px;border-radius:4px}

@media (max-width:1100px){ .editor{grid-template-columns:minmax(0,1fr)} .stickyp{position:static} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:14px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .side{top:env(safe-area-inset-top,0px)}
  .mark span,.mark i,.side .cta,.syncline{display:none}
  .logo-app{width:auto;height:64px}
  .mark{order:2;margin-left:auto;flex:none}
  .nav{order:1}
  .nav{flex-direction:row}
  .nav button span{display:none}
  .nav .mnew{display:flex;color:var(--accent)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  .grid,.grid.three{grid-template-columns:minmax(0,1fr)}
  .tabs-m{display:inline-flex}

  if(syncing){ scheduleSync(); return } syncing=true; setSync('busy');
  try{
    const stamps={...pend.docs}, ids=Object.keys(stamps);
    const rows=ids.map(id=>S.docs.find(d=>d.id===id)).filter(Boolean).map(d=>({id:d.id,body:d,updated_at:d.updatedAt||new Date().toISOString()}));
    if(rows.length){ const {error}=await sb.from('documents').upsert(rows); if(error) throw error; }
    ids.forEach(id=>{ if(pend.docs[id]===stamps[id]) delete pend.docs[id] });
    const dels=Object.keys(pend.del);
    if(dels.length){ const {error}=await sb.from('documents').delete().in('id',dels); if(error) throw error; dels.forEach(id=>delete pend.del[id]); }
    if(pend.settings){ const stamp=pend.settings; const {error}=await sb.from('app_settings').upsert({id:'main',body:S.settings,updated_at:new Date().toISOString()}); if(error) throw error; if(pend.settings===stamp) pend.settings=0; }
    const [r1,r2]=await Promise.all([sb.from('documents').select('id,body'), sb.from('app_settings').select('body').eq('id','main').maybeSingle()]);
    if(r1.error) throw r1.error; if(r2.error) throw r2.error;
    const local=new Map(S.docs.map(d=>[d.id,d]));
    const merged=r1.data.filter(r=>!pend.del[r.id]).map(r=>pend.docs[r.id]&&local.get(r.id)?local.get(r.id):Object.assign({},r.body,{id:r.id}));
    Object.keys(pend.docs).forEach(id=>{ if(!merged.some(d=>d.id===id)&&local.get(id)) merged.push(local.get(id)) });
    S.docs=merged;
    if(r2.data&&!pend.settings) S.settings=Object.assign(structuredClone(DEFAULT_SETTINGS),r2.data.body);
    if(!r2.data&&!pend.settings){ pend.settings=Date.now(); scheduleSync(); }
    synced=true; applyBrand(); lsWrite(); setSync('ok');
    if(S.view==='edit'){ const tb=document.getElementById('totbox'); if(tb) tb.innerHTML=totHtml(); } else if(!isTyping()) render();
  }catch(e){ setSync(navigator.onLine?'err':'off'); clearTimeout(syncT); syncT=setTimeout(sync,15000); }
  syncing=false;
}

/* ---------- maths ---------- */
function calc(d){
  const st=S.settings;
  const lines=(d.items||[]).map(it=>({...it,amount:(+it.qty||0)*(+it.rate||0)}));
  const sub=lines.reduce((a,b)=>a+b.amount,0);
  const discount=Math.min(sub,+d.discount||0);
  const net=sub-discount;
  const vatOn=st.vatRegistered && d.vat!==false && !d.reverseCharge;
  const vat=vatOn? net*(+st.vatRate||0)/100 : 0;
  const total=net+vat;
  const paid=d.type==='invoice'? S.docs.filter(r=>r.type==='receipt'&&r.parentId===d.id).reduce((a,r)=>a+(+r.amount||0),0):0;
  return {lines,sub,discount,net,vat,vatOn,total,paid,due:Math.max(0,total-paid)};
}
function statusOf(d){
  if(d.type==='receipt') return ['Paid','good'];
  if(d.type==='invoice'){ const c=calc(d);
    if(c.total>0&&c.due<=0.005) return ['Paid','good'];
    if(c.paid>0) return ['Part-paid','warn'];
    if(d.status==='draft') return ['Draft',''];
    if(d.due&&d.due<today()) return ['Overdue','bad'];
    return ['Unpaid','info']; }
  const m={draft:['Draft',''],sent:['Sent','info'],accepted:['Accepted','good'],declined:['Declined','bad']};
  if(d.status==='sent'&&d.validUntil&&d.validUntil<today()) return ['Expired','warn'];
  return m[d.status]||m.draft;
}
function docValue(d){return d.type==='receipt'?(+d.amount||0):calc(d).total}
function nextNumber(type){
  const p=TYPES[type].prefix; let max=0;
  S.docs.filter(d=>d.type===type).forEach(d=>{const n=parseInt(String(d.number||'').replace(/\D/g,''),10); if(n>max)max=n});
  return p+String(max+1).padStart(4,'0');
}

  if(type==='quote'){d.validUntil=addDays(d.date,+st.validity||30); d.depositPct=+st.depositPct||0;}

}

function fitPreview(){ const pv=document.getElementById('pv'),sc=document.getElementById('scaler'); if(!pv||!sc)return;

async function makePdf(){
  const d=S.editing, btn=document.getElementById('pdfbtn');
  if(!canDownload()){toast('Downloads are not available in this view.');return}
  if(!window.html2canvas||!window.jspdf){toast('PDF tools did not load. Refresh the page and try again.');return}
  btn.disabled=true; btn.textContent='Preparing PDF…';
  try{
    const host=document.getElementById('pdfhost'); host.innerHTML=paperHtml(d);
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',logging:false});
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}); const W=595.28,H=841.89; const h=canvas.height*W/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.93); let y=0; pdf.addImage(img,'JPEG',0,0,W,h);
    while(h-(y+=H)>2){ pdf.addPage(); pdf.addImage(img,'JPEG',0,-y,W,h); }
    host.innerHTML='';
    const name=`${d.number} ${TYPES[d.type].label} ${(d.client.name||'').replace(/[^\w\s-]/g,'')}`.trim()+'.pdf';
    await saveFile(name,pdf.output('blob'),true); toast('PDF ready');
  }catch(e){ if(!(e&&e.code==='declined')) toast(e&&e.code==='rate_limited'?'A save is already waiting for your OK.':'Could not create the PDF. Try again.'); }
  btn.disabled=false; btn.textContent=PDF_LBL;
}

let toastT; function toast(m){ clearTimeout(toastT); let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)} t.textContent=m; toastT=setTimeout(()=>t.remove(),2600); }

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-go],[data-act],[data-open],[data-open-link],[data-filter],[data-mtab],[data-tpl],[data-del-line],[data-pick],[data-close],[data-scrim],[data-inv],[data-del-rate],[data-setbrand]'); if(!el)return;
  if(el.hasAttribute('data-scrim')&&e.target!==el)return;
  if(el.dataset.go){ if(S.view==='edit')await flushEdit(); S.view=el.dataset.go; S.armDel=null; render(); return }
  if(el.dataset.open){ openDoc(el.dataset.open); return }
  if(el.dataset.openLink){ e.preventDefault(); await flushEdit(); openDoc(el.dataset.openLink); return }
  if(el.dataset.filter){ S.filter=el.dataset.filter; render(); return }
  if(el.dataset.mtab){ S.tab=el.dataset.mtab; document.querySelector('.editor').dataset.tab=S.tab; document.querySelectorAll('[data-mtab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mtab===S.tab)); fitPreview(); return }
  if(el.hasAttribute('data-close')||el.hasAttribute('data-scrim')){ closeModal(); return }
  if(el.dataset.setbrand){ S.settings.brand=el.dataset.setbrand; await persistSettings(); render(); return }
  if(el.dataset.tpl){ const T=TEMPLATES[el.dataset.tpl], d=S.editing; d.service=T.service; if(!d.title)d.title=el.dataset.tpl==='Open-plan kitchen'?'Open-plan kitchen conversion':T.service;
    T.pick.forEach(([needle,qty])=>{const r=S.settings.rates.find(x=>x.desc.toLowerCase().startsWith(needle.toLowerCase())); if(r)d.items.push({section:r.section,desc:r.desc,unit:r.unit,rate:r.rate,qty})});
    render(); touched(); toast('Estimate added. Adjust quantities to suit the site.'); return }
  if(el.dataset.delLine!==undefined){ S.editing.items.splice(+el.dataset.delLine,1); touched(true); return }
  if(el.dataset.pick){ const r=S.settings.rates.find(x=>x.id===el.dataset.pick); S.editing.items.push({section:r.section,desc:r.desc,unit:r.unit,rate:r.rate,qty:1}); closeModal(); touched(true); toast('Line added'); return }
  if(el.dataset.delRate!==undefined){ S.settings.rates.splice(+el.dataset.delRate,1); await persistSettings(); render(); return }
  if(el.dataset.inv){ const q=S.editing,c=calc(q),kind=el.dataset.inv; let items;
    if(kind==='full') items=structuredClone(q.items);
    else { const prior=S.docs.filter(d=>d.type==='invoice'&&d.parentId===q.id).reduce((a,d)=>a+calc(d).net,0);
      const amt=kind==='deposit'?c.net*q.depositPct/100:c.net-prior;
      items=[{section:kind==='deposit'?'Deposit':'Balance',desc:(kind==='deposit'?`Deposit (${q.depositPct}%) to confirm start, per quotation ${q.number}`:`Balance of works per quotation ${q.number}`),qty:1,unit:'item',rate:Math.round(amt*100)/100}]; }
    if(q.status!=='accepted'){q.status='accepted'; await persistDoc(q);}
    const inv=fromParent(q,'invoice',{items,discount:kind==='full'?q.discount:0}); await persistDoc(inv); closeModal(); S.editing=structuredClone(inv); render(); toast('Invoice '+inv.number+' created'); return }
  const a=el.dataset.act; if(!a)return;
  if(a==='new-quote'){ if(S.view==='edit')await flushEdit(); newQuote(); }
  if(a==='new-invoice'){ S.editing=blank('invoice'); S.view='edit'; render(); }
  if(a==='save') save();
  if(a==='add-line'){ S.editing.items.push({section:'',desc:'',qty:1,unit:'item',rate:0}); touched(true); const ins=document.querySelectorAll('#items [data-ik="desc"]'); ins[ins.length-1]&&ins[ins.length-1].focus(); }
  if(a==='pick'){ modal(pickModal('')); document.getElementById('pq').focus(); }
  if(a==='pdf') makePdf();
  if(a==='copy-wa') copy(waText(S.editing));
  if(a==='to-invoice'){ await flushEdit(); modal(toInvoiceModal()); }
  if(a==='to-receipt'){ await flushEdit(); modal(receiptModal()); }
  if(a==='make-receipt'){ const inv=S.editing; const r=fromParent(inv,'receipt',{amount:+document.getElementById('ramt').value||0,date:document.getElementById('rdate').value||today(),method:document.getElementById('rmeth').value,ref:document.getElementById('rref').value});
    await persistDoc(r); closeModal(); S.editing=structuredClone(r); render(); toast('Receipt '+r.number+' issued'); }
  if(a==='del'){ if(S.armDel!==S.editing.id){S.armDel=S.editing.id; render(); return} const id=S.editing.id; S.armDel=null; S.editing=null; await removeDoc(id); S.view='docs'; render(); toast('Deleted'); }
  if(a==='export'){ try{ await saveFile('Hiprobuild backup '+today()+'.json',new Blob([JSON.stringify({app:'hiprobuild-estimator',v:1,settings:S.settings,docs:S.docs},null,1)],{type:'application/json'})); toast('Backup saved'); }catch(e){ if(!(e&&e.code==='declined')) toast('Could not save the backup. Try again.'); } }
  if(a==='signout') signOut();
  if(a==='install'&&deferredPrompt){ deferredPrompt.prompt(); try{await deferredPrompt.userChoice}catch(e){} deferredPrompt=null; render(); }
  if(a==='add-rate'){ S.settings.rates.unshift({id:uid(),section:'Other',desc:'New item',unit:'item',rate:0}); await persistSettings(); render(); }
});

    if(t.dataset.k){ let v=t.type==='checkbox'?t.checked:t.value; if(t.type==='number')v=v===''?'':+v; setPath(S.editing,t.dataset.k,v); touched(); return }
    if(t.dataset.ik){ const row=t.closest('[data-i]'), i=+row.dataset.i, it=S.editing.items[i]; it[t.dataset.ik]=t.type==='number'?(t.value===''?'':+t.value):t.value;
      const amt=document.querySelector(`[data-amt="${i}"]`); if(amt) amt.textContent=money((+it.qty||0)*(+it.rate||0)); touched(); return }
  }
  if(S.view==='rates'&&t.dataset.rk){ const i=+t.closest('[data-r]').dataset.r; S.settings.rates[i][t.dataset.rk]=t.dataset.rk==='rate'?(+t.value||0):t.value; clearTimeout(setT); setT=setTimeout(persistSettings,700); return }
  if(S.view==='settings'&&t.dataset.sk){ const k=t.dataset.sk; let v=t.type==='checkbox'?t.checked:t.value; if(['vatRate','payDays','validity','depositPct'].includes(k))v=+v||0; setPath(S.settings,k,v); clearTimeout(setT); setT=setTimeout(persistSettings,700); }
});
document.addEventListener('change',e=>{ if(e.target.matches('#status,select[data-k],input[type=checkbox][data-k],select[data-ik]')) e.target.dispatchEvent(new Event('input',{bubbles:true})) ;});
document.addEventListener('change',async e=>{ if(e.target.id!=='importfile'||!e.target.files[0])return;
  try{ const data=JSON.parse(await e.target.files[0].text()); if(!data||!Array.isArray(data.docs)) throw 0;
    if(data.settings){ S.settings=Object.assign(structuredClone(DEFAULT_SETTINGS),data.settings); await persistSettings(); }
    for(const d of data.docs){ if(d&&d.id&&d.type) await persistDoc(d); }
    toast('Restored '+data.docs.length+' documents'); render();
  }catch(err){ toast('That file is not a Hiprobuild backup. Choose the .json file you downloaded.'); }
  e.target.value=''; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- boot ---------- */
function ingest(settings,docs){ if(settings) S.settings=Object.assign(structuredClone(DEFAULT_SETTINGS),settings); if(docs) S.docs=docs; applyBrand(); }
document.getElementById('loginform').addEventListener('submit',async e=>{
  e.preventDefault(); const btn=e.target.querySelector('button'), err=document.getElementById('loginerr');
  err.hidden=true; btn.disabled=true; btn.textContent='Signing in…';
  try{ await signIn(document.getElementById('lemail').value.trim(),document.getElementById('lpass').value); }
  catch(x){ err.textContent=!navigator.onLine?'You are offline. Connect to the internet to sign in.':/invalid/i.test(x.message||'')?'That email or password is not right. Check them and try again.':'Could not sign in right now. Try again in a minute.'; err.hidden=false; }
  btn.disabled=false; btn.textContent='Sign in';
});
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(S.view==='settings') render(); });
(async function boot(){
  const cached=lsRead();
  if(cached){ ingest(cached.settings,cached.docs); if(cached.pend) pend=Object.assign({docs:{},del:{},settings:0},cached.pend); synced=!!cached.synced; }
  if(CFG.url&&CFG.key&&window.supabase){
    try{ sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
      const {data}=await sb.auth.getSession(); session=data.session;
      sb.auth.onAuthStateChange((ev,s)=>{ session=s; if(ev==='SIGNED_IN') scheduleSync(); });
    }catch(e){ sb=null }
  }
  S.loaded=true; applyBrand(); render(); sync();
  window.addEventListener('online',scheduleSync); window.addEventListener('offline',()=>setSync('off'));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleSync() });
  setInterval(()=>{ if(!document.hidden&&!syncing) sync() },60000);
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
