<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hiprobuild Estimator</title>
<meta name="theme-color" content="#1E2B39">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hiprobuild"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: sidebar app shell; editor = form column + live A4 paper with a drawing-style title block */
:root{
  --accent-l:#3C78AC; --accent-d:#86BDEB; --metal-l:#9AA6B3; --metal-d:#6F7B88;
  --band:#1E2B39; --band-hi:#9CCBF0; --paper-accent:#3C78AC;
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:#D8DDE4; --fg:#111820; --muted:#5B6673;
  --accent:var(--accent-l); --metal:var(--metal-l); --accent-ink:#FFFFFF;
  --good:#1D7448; --good-bg:#E2F2E9; --warn:#9A6200; --warn-bg:#FBEFD8; --bad:#AE3329; --bad-bg:#F8E3E1; --info-bg:#E6EEF6;
  --paper:#FFFFFF; --paper-ink:#14181D; --paper-muted:#5C6570; --paper-line:#D6DBE1; --paper-soft:#F3F5F7;
  --shadow:0 1px 2px rgba(17,24,32,.06),0 8px 24px rgba(17,24,32,.06);
  --logo-filter:invert(1) brightness(.12);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-brand="gold"]{ --accent-l:#94722F; --accent-d:#D4B066; --metal-l:#B9A27A; --metal-d:#8A7550; --band:#0D0D0D; --band-hi:#D4B066; --paper-accent:#8E6C2A; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1115; --surface:#151A20; --surface-2:#1B2129; --line:#2A323C; --fg:#E6EBF0; --muted:#94A1AF;
  --accent:var(--accent-d); --metal:var(--metal-d); --accent-ink:#0D1115;
  --good:#5CC48D; --good-bg:#16291F; --warn:#E3AE4F; --warn-bg:#2B2213; --bad:#EE8277; --bad-bg:#2E1A18; --info-bg:#18232F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --logo-filter:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1115; --surface:#151A20; --surface-2:#1B2129; --line:#2A323C; --fg:#E6EBF0; --muted:#94A1AF;
  --accent:var(--accent-d); --metal:var(--metal-d); --accent-ink:#0D1115;
  --good:#5CC48D; --good-bg:#16291F; --warn:#E3AE4F; --warn-bg:#2B2213; --bad:#EE8277; --bad-bg:#2E1A18; --info-bg:#18232F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --logo-filter:none; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.mark{display:flex;flex-direction:column;gap:8px}
.logo-app{display:block;width:118px;height:auto;filter:var(--logo-filter)}
.mark b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.14em}
.mark span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.mark i{display:block;height:3px;width:44px;background:linear-gradient(90deg,var(--accent),var(--metal));margin-top:8px;border-radius:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--info-bg);color:var(--fg)}
.nav svg{width:17px;height:17px;flex:none}
.side .cta{margin-top:auto}
.syncline{margin-top:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.syncline::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--metal)}
.syncline:has([data-state="ok"])::before{background:var(--good)}
.syncline:has([data-state="err"])::before,.syncline:has([data-state="off"])::before{background:var(--warn)}
.syncline+.cta{margin-top:0}
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--band)}
.login form{width:min(380px,100%);background:var(--surface);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login .lg-logo{display:block;height:96px;width:auto;margin:0 auto 6px;filter:var(--logo-filter)}
.login h1{font-size:20px;text-align:center;margin:0}
.login p.sub{text-align:center;margin:0}
.login .err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px;font-size:13px}
.nav .mnew{display:none}
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0;letter-spacing:.01em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--metal)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:20px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--band);border-color:var(--band);color:#F2F5F8}
.kpi.lead .l,.kpi.lead .s{color:#AEB8C3}
.kpi.lead .v{color:var(--band-hi)}

.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:640px}
.list th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.list td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:var(--surface-2)}
.list .r{text-align:right}
.who{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{color:var(--muted);max-width:44ch;margin:0}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:22px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,.items input,.items select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.items input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) 66px 70px 92px 96px 30px;gap:6px;align-items:center}
.it.h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.it .amt{text-align:right;font-family:var(--f-mono);font-size:13px}
.it .desc{display:flex;flex-direction:column;gap:4px}
.it .desc input.secin{font-size:11.5px;padding:4px 8px;color:var(--muted)}
.it input.n{text-align:right;font-family:var(--f-mono)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:6px}
.x:hover{background:var(--bad-bg);color:var(--bad)}
.totbox{display:flex;flex-direction:column;gap:6px;align-self:flex-end;min-width:260px}
.totbox div{display:flex;justify-content:space-between;gap:24px}
.totbox .big{font-family:var(--f-display);font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:8px}
.tpl{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed var(--metal);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.stickyp{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.pv{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden}
.scaler{transform-origin:top left}
.tabs-m{display:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;box-shadow:var(--shadow)}
.saving{font-size:12px;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.picker{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.picker .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 4px 4px}
.picker button{display:flex;justify-content:space-between;gap:12px;border:1px solid transparent;background:var(--surface-2);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left}
.picker button:hover{border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rates .it{grid-template-columns:72px 130px minmax(0,1fr) 72px 92px 92px 90px 30px}
.rates .it .tot{text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:600}
.rates .it .code-c{font-family:var(--f-mono);font-size:12px;text-transform:uppercase}
.rates .it input,.rates .it select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.rates .it input.n{text-align:right;font-family:var(--f-mono)}
.libsv:empty{display:none}
.libsv button{align-self:flex-start;border:0;background:none;color:var(--accent);font-size:11.5px;font-weight:600;padding:2px 2px;cursor:pointer}
.libsv button:hover{text-decoration:underline}
.picker .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
.gptbox{width:100%;min-height:220px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px}
.swatch{display:flex;gap:12px;flex-wrap:wrap}
.sw{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--surface);display:flex;gap:10px;align-items:center;font-weight:600}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw i{display:block;width:34px;height:34px;border-radius:8px}

/* paper (always a white A4 sheet) */
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column}
.p-band{background:var(--band);color:#F2F4F6;padding:34px 44px 28px;display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:flex-end;gap:20px}
.p-word{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.p-logo{display:block;height:92px;width:auto}
.p-word b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.16em;line-height:1}
.p-word span{display:block;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#AEB8C3;margin-top:8px}
.p-word em{display:block;font-style:normal;font-size:11px;color:var(--band-hi);margin-top:12px;letter-spacing:.02em}
.p-type{text-align:left}
.p-type b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.2em;color:var(--band-hi)}
.p-type span{font-family:var(--f-mono);font-size:12px;color:#C9D1D9}
.p-rule{height:4px;background:linear-gradient(90deg,var(--band-hi),var(--metal-l) 60%,var(--paper-line))}
.p-body{padding:28px 44px 24px;display:flex;flex-direction:column;gap:20px;flex:1}
.tb{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--paper-ink)}
.tb>div{padding:8px 10px;border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line)}
.tb>div:nth-child(4n){border-right:0}
.tb .s2{grid-column:span 2}
.tb .s4{grid-column:span 4;border-right:0}
.tb .last{border-bottom:0}
.tb small{display:block;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-muted);font-weight:600;margin-bottom:2px}
.tb p{margin:0;white-space:pre-line}
.tb .strong{font-weight:600}
.p-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
table.p-items{width:100%;border-collapse:collapse}
.p-items th{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-muted);text-align:left;padding:0 6px 7px;border-bottom:1.5px solid var(--paper-ink);font-weight:600}
.p-items td{padding:7px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.p-items .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.p-items tr.grp td{background:var(--paper-soft);font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--paper-accent);padding:6px 6px 5px;border-bottom:0}
.p-items tr.grp td span{float:right;font-family:var(--f-mono);letter-spacing:0;color:var(--paper-muted);font-weight:500}
.p-split{display:grid;grid-template-columns:1fr 280px;gap:28px;align-items:start}
.p-tot div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--paper-line);font-variant-numeric:tabular-nums}
.p-tot div span:last-child{font-family:var(--f-mono)}
.p-tot .grand{border-bottom:0;margin-top:6px;padding:11px 12px;background:var(--band);color:#F2F4F6;font-weight:700;font-size:14px}
.p-tot .grand span:last-child{color:var(--band-hi)}
.p-tot .due{border-bottom:0;padding:8px 12px;border:1.5px solid var(--paper-ink);margin-top:8px;font-weight:700}
.p-h{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--paper-accent);margin:0 0 5px}
.p-txt{margin:0;white-space:pre-line;color:var(--paper-ink)}
.p-small{font-size:10.5px;color:var(--paper-muted);white-space:pre-line;margin:0}
.p-sign{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:6px}
.p-sign div{border-bottom:1px solid var(--paper-ink);height:38px;position:relative}
.p-sign div span{position:absolute;bottom:-17px;left:0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted)}
.p-paid{display:flex;gap:18px;align-items:center;border:1.5px solid var(--paper-ink);padding:16px 18px}
.p-paid b{font-family:var(--f-display);font-size:28px;letter-spacing:.02em}
.stamp{font-family:var(--f-display);font-weight:800;letter-spacing:.24em;font-size:15px;color:var(--paper-accent);border:2.5px solid var(--paper-accent);padding:6px 12px;transform:rotate(-4deg);display:inline-block}
.p-foot{padding:14px 44px 22px;border-top:1px solid var(--paper-line);display:flex;justify-content:space-between;gap:16px;font-size:9.5px;color:var(--paper-muted)}
.p-foot b{color:var(--paper-ink)}
/* estimate document (quotes): real A4 pages with header + footer on each */
.pages{display:flex;flex-direction:column;gap:18px;width:794px}
.q-sheet{width:794px;height:1123px;background:#fff;color:var(--paper-ink);font-family:var(--f-body);font-size:11.5px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.q-head{background:var(--band);color:#F2F4F6;display:flex;align-items:center;gap:16px;padding:14px 40px;flex:none}
.q-head img{height:46px;width:auto;display:block}
.q-head div{margin-left:auto;text-align:right}
.q-head b{display:block;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.q-head span{display:block;font-size:9px;color:var(--band-hi)}
.q-head i,.q-cc i{font-style:normal;opacity:.55;margin:0 6px}
.q-rule{height:4px;flex:none;background:linear-gradient(90deg,var(--band-hi),var(--metal-l) 60%,var(--paper-line))}
.q-body{flex:1;min-height:0;overflow:hidden;padding:24px 40px 10px}
.q-body>*+*{margin-top:16px}
.q-foot{flex:none;margin:0 40px;padding:9px 0 16px;border-top:2px solid var(--band-hi);display:flex;justify-content:space-between;gap:12px;font-size:8.5px;color:var(--paper-muted)}
.q-foot b{color:var(--paper-ink)}
.q-title{text-align:center}
.q-title h2{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:var(--band);margin:0}
.q-title p{margin:3px 0 0;color:var(--paper-accent);font-size:11px}
.q-cband{background:var(--band);color:#F2F4F6;text-align:center;padding:34px 40px 22px;flex:none}
.q-cband img{height:122px;width:auto;display:block;margin:0 auto}
.q-cc{margin-top:14px;font-size:10px;color:var(--band-hi)}
.q-cbody{flex:1;min-height:0;padding:40px 56px 22px;text-align:center;display:flex;flex-direction:column;align-items:center}
.q-kick{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--paper-accent)}
.q-big{font-family:var(--f-display);font-weight:800;font-size:58px;letter-spacing:.14em;color:var(--band);line-height:1.05;margin-top:4px}
.q-bar{width:90px;height:4px;background:var(--band-hi);margin:18px auto}
.q-cli{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.q-site{color:var(--paper-muted);font-size:12.5px;margin-top:4px;white-space:pre-line}
.q-proj{font-size:14px;margin-top:14px;max-width:560px;font-weight:600}
.q-meta{margin-top:10px;font-size:11px;color:var(--paper-muted)}
.q-meta b{color:var(--paper-ink);font-weight:600}
.q-trades{margin-top:24px;padding:9px 16px;border-top:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--band);text-transform:uppercase}
.q-badges{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.q-badge{flex:0 1 150px;border:1.5px solid var(--paper-line);border-radius:10px;padding:12px 10px 10px;text-align:center}
.q-badge b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--band);line-height:1.15}
.q-badge .st{display:block;color:#E8A400;font-size:12px;letter-spacing:1px}
.q-badge small{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--paper-accent);margin-top:4px}
.q-badge em{display:block;font-style:normal;font-size:8.5px;color:var(--paper-muted);margin-top:2px;word-break:break-word}
.q-badge.dk{background:var(--band);border-color:var(--band)}
.q-badge.dk b{color:#fff}.q-badge.dk small{color:var(--band-hi)}.q-badge.dk em{color:#C9D1D9}
.q-prep{margin-top:20px;font-size:11px;color:var(--paper-muted)}
.q-prep b{color:var(--paper-ink)}
.q-kv{width:100%;border-collapse:collapse}
.q-kv td{padding:4px 0;vertical-align:top;white-space:pre-line}
.q-kv td:first-child{width:120px;font-weight:700;color:var(--band)}
.q-p{margin-left:0;margin-right:0;margin-bottom:0;white-space:pre-line}
.q-sig b{font-family:var(--f-display)}
.q-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-card{border-left:4px solid var(--band-hi);background:var(--paper-soft);padding:10px 12px}
.q-card.w{grid-column:1/-1}
.q-card h4{margin:0 0 3px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-accent)}
.q-card p{margin:0;white-space:pre-line}
.q-banner{background:var(--band);color:#F2F4F6;text-align:center;padding:12px 16px;font-weight:600;font-size:11.5px}
.q-h3{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--band);margin:0 0 6px;padding-bottom:5px;border-bottom:2px solid var(--band-hi)}
.q-sec{background:var(--band);color:#fff;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;display:flex;justify-content:space-between;gap:12px}
.q-sec span{font-family:var(--f-mono);letter-spacing:0;color:var(--band-hi)}
.q-tbl{width:100%;border-collapse:collapse}
.q-tbl td{padding:8px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.q-tbl th{background:var(--band);color:#fff;text-align:left;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:7px 8px}
.q-tbl .no{width:36px;font-weight:700;color:var(--band);font-family:var(--f-mono);font-size:10.5px}
.q-tbl .am{width:100px;text-align:right;font-weight:700;font-family:var(--f-mono);white-space:nowrap}
.q-tbl .r{text-align:right;white-space:nowrap}
.q-tbl b{font-weight:600}
.q-tbl p{margin:2px 0 0;font-size:10.5px;white-space:pre-line}
.q-tbl small{display:block;color:var(--paper-muted);font-family:var(--f-mono);font-size:9.5px;margin-top:2px}
.q-tbl tr.sub td{background:var(--paper-soft);font-weight:700;border-bottom:0}
.q-tbl tr.tot td{background:var(--band);color:#fff;font-weight:800;font-size:13px;border:0}
.q-tbl tr.tot td.am{color:var(--band-hi)}
.q-tbl.list td{padding:5px 6px;font-size:10.5px}
.q-tgrp{font-family:var(--f-display);font-weight:800;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-accent);margin:2px 0 4px}
.q-tbl.list p{margin-top:5px}
.q-ln{display:inline-block;width:150px;border-bottom:1px solid var(--paper-ink);height:12px;vertical-align:baseline}
.q-fill{border-bottom:1px solid var(--paper-ink);height:26px;position:relative;margin-top:4px}
.q-fill[data-l]::before{content:attr(data-l) ":";position:absolute;left:0;bottom:3px;font-size:10px;color:var(--paper-muted)}
.q-note{font-size:10px;color:var(--paper-muted);font-style:italic;background:var(--paper-soft);padding:8px 10px;margin-left:0;margin-right:0;margin-bottom:0}
.q-signs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
.q-signs div{border-top:1px solid var(--paper-ink);padding-top:6px;font-size:10px;color:var(--paper-muted)}
.q-signs b{display:block;color:var(--paper-ink)}
.ex-flag{font-family:var(--f-mono);font-size:10px;background:var(--warn-bg);color:var(--warn);padding:2px 6px;border-radius:4px}

@media (max-width:1100px){ .editor{grid-template-columns:minmax(0,1fr)} .stickyp{position:static} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:14px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .side{top:env(safe-area-inset-top,0px)}
  .mark span,.mark i,.side .cta,.syncline{display:none}
  .logo-app{width:auto;height:64px}
  .mark{order:2;margin-left:auto;flex:none}
  .nav{order:1}
  .nav{flex-direction:row}
  .nav button span{display:none}
  .nav .mnew{display:flex;color:var(--accent)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  .grid,.grid.three{grid-template-columns:minmax(0,1fr)}
  .tabs-m{display:inline-flex}
  .editor[data-tab="edit"] .stickyp{display:none}
  .editor[data-tab="preview"] .form{display:none}
  .it{grid-template-columns:minmax(0,1fr) 58px 64px 30px}
  .it .unit-c,.it .amt{display:none}
  .it.h .unit-c,.it.h .amt{display:none}
  .rates .it{grid-template-columns:repeat(3,minmax(0,1fr)) 30px}
  .rates .it .sec-c,.rates .it .unit-c,.rates .it .code-c{display:none}
  .rates .it .desc-c{grid-column:1/4;grid-row:1}
  .rates .it .x{grid-column:4;grid-row:1}
  .rates .it.h{display:none}
  .totbox{min-width:0;align-self:stretch}
  h1{font-size:23px}
}
/* narrow form column (e.g. laptop with preview open): stack each line */
.form{container-type:inline-size}
@media (min-width:821px){ @container (max-width:640px){
  .items .it{grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr) 30px;row-gap:6px}
  .items .it .desc{grid-column:1/5;grid-row:1}
  .items .it .x{grid-column:5;grid-row:1}
  .items .it.h>span:first-child{display:none}
  .items .it:not(.h){padding-bottom:10px;border-bottom:1px solid var(--line)}
  .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
} }
@media (max-width:480px){ .kpis{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .btn,.nav button,.chip{transition:background .15s,border-color .15s,color .15s} }

function normRates(list){ let changed=false; (list||[]).forEach(r=>{
  if(!r.id){r.id=uid();changed=true}
  if(r.labour===undefined&&r.materials===undefined){ r.labour=+r.rate||0; r.materials=0; changed=true; }
  r.labour=+r.labour||0; r.materials=+r.materials||0; r.rate=Math.round((r.labour+r.materials)*100)/100;
  if(!r.code){ r.code=nextCode(list,r.section); changed=true; } });
  const seen={}; (list||[]).forEach(r=>{ const c=String(r.code).toUpperCase(); if(seen[c]){ r.code=''; r.code=nextCode(list,r.section); changed=true; } seen[String(r.code).toUpperCase()]=1; r.code=String(r.code).toUpperCase(); });
  return changed; }
const libFind=(code,desc)=>{ const L=S.settings.rates, c=String(code||'').trim().toUpperCase(), d=String(desc||'').trim().toLowerCase();
  return (c&&L.find(r=>String(r.code).toUpperCase()===c)) || (d&&L.find(r=>r.desc.toLowerCase()===d)) || null; };

function libState(it){ if(!(+it.rate>0)||!String(it.desc||'').trim()) return ''; const r=libFind(it.code,it.desc); if(!r) return 'new'; return Math.abs((+r.rate||0)-(+it.rate))>0.004?'upd':''; }

function calc(d){
  const st=S.settings;

  const net=sub-discount;
  const vatOn=st.vatRegistered && d.vat!==false && !d.reverseCharge;
  const vat=vatOn? net*(+st.vatRate||0)/100 : 0;
  const total=net+vat;
  const paid=d.type==='invoice'? S.docs.filter(r=>r.type==='receipt'&&r.parentId===d.id).reduce((a,r)=>a+(+r.amount||0),0):0;
  return {lines,sub,discount,net,vat,vatOn,total,paid,due:Math.max(0,total-paid)};
}

}

/* ---------- estimate document (quotes) ---------- */
function stagesOf(d){ const src=(d&&d.stages!=null&&String(d.stages).trim()!=='')?d.stages:(S.settings.doc||{}).paymentStages||'';
  return String(src).split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]).map(([name,pct,when])=>({name,pct:parseFloat(pct)||0,when:when||''})); }
function depPct(d){ if(!d||d.type!=='quote') return 0; const s=stagesOf(d); return s.length?s[0].pct:(+d.depositPct||0); }
function fillLetter(d){ const t=(S.settings.doc||{}).letter||DEFAULT_SETTINGS.doc.letter;

function qPaginate(d,blocks){
  const m=document.createElement('div'); m.style.cssText='position:fixed;left:-30000px;top:0;visibility:hidden;pointer-events:none';
  document.body.appendChild(m); m.innerHTML=qSheet(d,'',2,2); const body=m.querySelector('.q-body');
  const pages=[], over=()=>body.scrollHeight>body.clientHeight+1, empty=()=>!body.children.length;
  const flush=()=>{ if(!empty()) pages.push(body.innerHTML); body.innerHTML=''; };
  const add=h=>{ const w=document.createElement('div'); w.innerHTML=h; const el=w.firstElementChild; body.appendChild(el); return el; };
  try{
    for(const b of blocks){
      if(b.brk) flush();
      if(!b.rows){ const el=add(b.html); if(over()&&body.children.length>1){ el.remove(); flush(); add(b.html); } continue; }
      let el=add(b.html), tb=el.querySelector('tbody'), placed=0;
      if(!b.rows.length) continue;
      for(const r of b.rows){
        tb.insertAdjacentHTML('beforeend',r);
        if(over()){
          tb.lastElementChild.remove();
          if(placed===0){ el.remove(); flush(); el=add(b.html); }
          else { flush(); el=add(b.cont||b.html); }
          tb=el.querySelector('tbody'); tb.insertAdjacentHTML('beforeend',r);
        }
        placed++;
      }
    }
    flush();
  } finally { m.remove(); }
  return pages;
}

    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}); const W=595.28,H=841.89; const h=canvas.height*W/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.93); let y=0; pdf.addImage(img,'JPEG',0,0,W,h);
    while(h-(y+=H)>2){ pdf.addPage(); pdf.addImage(img,'JPEG',0,-y,W,h); }
    host.innerHTML='';

function splitRows(txt){
  txt=String(txt||'').replace(/\r\n?/g,'\n'); const first=txt.split('\n').find(l=>l.trim())||''; const d=first.includes('\t')?'\t':first.split(';').length>first.split(',').length?';':',';
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cell+='"';i++} else q=false } else cell+=ch; continue }
    if(ch==='"'&&cell==='') q=true; else if(ch===d){row.push(cell);cell=''} else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''} else cell+=ch; }
  row.push(cell); rows.push(row); return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(Boolean));
}
function parseRates(txt){
  const rows=splitRows(txt); const hi=rows.findIndex(r=>r.some(c=>/^(item|description|labour|labor|materials?)\b/i.test(c)));
  if(hi<0) throw new Error('nohead');
  const H=rows[hi].map(c=>c.toLowerCase()); const col=re=>H.findIndex(h=>re.test(h));
  const ci={code:col(/^code/),sec:col(/categor|trade|section/),desc:col(/^(item|description|desc)/),unit:col(/^unit/),lab:col(/^lab/),mat:col(/^mat/),tot:col(/^(total|rate)/)};
  if(ci.desc<0) throw new Error('nohead');
  const num=v=>{ const n=parseFloat(String(v??'').replace(/[£,\s]/g,'')); return isFinite(n)?n:null };
  return rows.slice(hi+1).map(r=>{ const g=k=>ci[k]<0?'':(r[ci[k]]||''); const lab=num(g('lab')),mat=num(g('mat')),tot=num(g('tot'));
    return {code:g('code').toUpperCase(),section:g('sec')||'Other',desc:g('desc'),unit:toUnit(g('unit')),labour:lab,materials:mat,total:tot}; }).filter(x=>x.desc);
}

function parseGpt(txt){
  txt=String(txt||'').replace(/```(json)?/gi,'').replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
  const a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if(a<0||b<=a) throw new Error('none');
  let j; try{ j=JSON.parse(txt.slice(a,b+1)); }catch(e){ j=JSON.parse(txt.slice(a,b+1).replace(/,\s*([}\]])/g,'$1')); }
  const num=v=>{ const n=parseFloat(String(v??'').replace(/[£,\s]/g,'')); return isFinite(n)?n:0 };
  let fromLib=0;
  const items=(Array.isArray(j.items)?j.items:[]).map(it=>{
    const line={code:String(it.code||'').trim().toUpperCase(),section:String(it.section||it.trade||'').trim(),desc:String(it.description||it.desc||it.name||'').trim(),
      qty:num(it.qty??it.quantity??1)||1,unit:toUnit(it.unit||'item'),rate:num(it.rate??it.price??it.unit_price??it.amount),detail:String(it.details||it.detail||'').trim()};
    const r=libFind(line.code,line.desc);
    if(r){ fromLib++; line.code=r.code; line.section=r.section; line.desc=r.desc; line.unit=r.unit; if(+r.rate>0) line.rate=r.rate; }
    else if(line.code&&!line.desc) line.desc='Item '+line.code+' (not in price library)';
    return line;
  }).filter(it=>it.desc||it.rate);
  const c=j.client||{}, pays=Array.isArray(j.payments_received)?j.payments_received.filter(p=>num(p.amount)):[];
  let notes=String(j.notes||'').trim();
  if(pays.length) notes+=(notes?'\n\n':'')+'Payments received to date:\n'+pays.map(p=>`${p.date?fdate(p.date)+': ':''}${money(num(p.amount))}${p.note?' ('+p.note+')':''}`).join('\n');
  const t=String(j.project_title||j.title||'');
  const svc=SERVICES.find(s=>s.toLowerCase()===String(j.service||'').toLowerCase())
    || (/open.?plan/i.test(t)?SERVICES[0]:/wall|structural|steel|beam/i.test(t)?SERVICES[1]:/bathroom/i.test(t)?SERVICES[3]:/sash|window/i.test(t)?SERVICES[6]:/insulat/i.test(t)?SERVICES[7]:/kitchen/i.test(t)?SERVICES[2]:/refurb/i.test(t)?SERVICES[4]:/joinery|carpent/i.test(t)?SERVICES[5]:'');
  return {fromLib,type:/invoice/i.test(j.type||'')?'invoice':'quote',client:{name:String(c.name||''),email:String(c.email||''),phone:String(c.phone||''),address:String(c.address||'')},
    site:String(j.site_address||j.site||''),title:t,service:svc,items,notes,depositPct:j.deposit_percent===undefined||j.deposit_percent===''?null:num(j.deposit_percent)};
}

  if(el.dataset.openLink){ e.preventDefault(); await flushEdit(); openDoc(el.dataset.openLink); return }
  if(el.dataset.filter){ S.filter=el.dataset.filter; render(); return }
  if(el.dataset.mtab){ S.tab=el.dataset.mtab; document.querySelector('.editor').dataset.tab=S.tab; document.querySelectorAll('[data-mtab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mtab===S.tab)); fitPreview(); return }
  if(el.hasAttribute('data-close')||el.hasAttribute('data-scrim')){ closeModal(); return }
  if(el.dataset.setbrand){ S.settings.brand=el.dataset.setbrand; await persistSettings(); render(); return }
  if(el.dataset.tpl){ const T=TEMPLATES[el.dataset.tpl], d=S.editing; d.service=T.service; if(!d.title)d.title=el.dataset.tpl==='Open-plan kitchen'?'Open-plan kitchen conversion':T.service;
    T.pick.forEach(([needle,qty])=>{const r=S.settings.rates.find(x=>x.desc.toLowerCase().startsWith(needle.toLowerCase())); if(r)d.items.push(libLine(r,qty))});
    render(); touched(); toast('Estimate added. Adjust quantities to suit the site.'); return }
  if(el.dataset.delLine!==undefined){ S.editing.items.splice(+el.dataset.delLine,1); touched(true); return }
  if(el.dataset.pick){ const r=S.settings.rates.find(x=>x.id===el.dataset.pick); S.editing.items.push(libLine(r,1)); closeModal(); touched(true); toast('Line added'); return }
  if(el.dataset.libsave!==undefined){ modal(libSaveModal(+el.dataset.libsave)); return }
  if(el.dataset.delRate!==undefined){ S.settings.rates.splice(+el.dataset.delRate,1); await persistSettings(); render(); return }
  if(el.dataset.inv){ const q=S.editing,c=calc(q),kind=el.dataset.inv; let items;
    if(kind==='full') items=structuredClone(q.items);
    else { const prior=S.docs.filter(d=>d.type==='invoice'&&d.parentId===q.id).reduce((a,d)=>a+calc(d).net,0);
      const amt=kind==='deposit'?c.net*q.depositPct/100:c.net-prior;
      items=[{section:kind==='deposit'?'Deposit':'Balance',desc:(kind==='deposit'?`Deposit (${q.depositPct}%) to confirm start, per quotation ${q.number}`:`Balance of works per quotation ${q.number}`),qty:1,unit:'item',rate:Math.round(amt*100)/100}]; }
    if(q.status!=='accepted'){q.status='accepted'; await persistDoc(q);}
    const inv=fromParent(q,'invoice',{items,discount:kind==='full'?q.discount:0}); await persistDoc(inv); closeModal(); S.editing=structuredClone(inv); render(); toast('Invoice '+inv.number+' created'); return }
  const a=el.dataset.act; if(!a)return;
  if(a==='new-quote'){ if(S.view==='edit')await flushEdit(); newQuote(); }
  if(a==='new-invoice'){ S.editing=blank('invoice'); S.view='edit'; render(); }
  if(a==='save') save();
  if(a==='import-gpt'){ modal(gptModal()); setTimeout(()=>{const t=document.getElementById('gptin'); t&&t.focus()},50); }
  if(a==='gpt-go'){ const err=document.getElementById('gpterr'); let g;
    try{ g=parseGpt(document.getElementById('gptin').value); if(!g.items.length) throw new Error('noitems'); }
    catch(x){ err.textContent=x.message==='noitems'?'No price lines found. In ChatGPT, type "export" again and paste the whole code block.':'That doesn\'t look like a ChatGPT export. In ChatGPT, type "export", tap Copy on the code block, then paste it here.'; err.hidden=false; return }
    const ed=S.view==='edit'&&S.editing&&S.editing.type!=='receipt';
    const d=ed?S.editing:blank(g.type);
    d.items.push(...g.items);
    ['name','email','phone','address'].forEach(k=>{ if(!d.client[k]&&g.client[k]) d.client[k]=g.client[k] });
    if(!d.site&&g.site) d.site=g.site; if(!d.title&&g.title) d.title=g.title; if(g.service&&!ed) d.service=g.service;
    if(g.notes) d.notes=d.notes?d.notes+'\n\n'+g.notes:g.notes;
    if(d.type==='quote'&&g.depositPct!==null&&!ed) d.depositPct=g.depositPct;
    closeModal(); if(!ed){ S.editing=d; S.view='edit'; S.tab='edit'; } render(); touched();
    const nop=g.items.filter(x=>!(+x.rate)).length; toast(g.items.length+' line'+(g.items.length===1?'':'s')+' imported'+(g.fromLib?', '+g.fromLib+' priced from your library':'')+(nop?'. '+nop+' still need a price':'')+'. Check, then tap Save.'); }
  if(a==='add-line'){ S.editing.items.push({section:'',desc:'',qty:1,unit:'item',rate:0}); touched(true); const ins=document.querySelectorAll('#items [data-ik="desc"]'); ins[ins.length-1]&&ins[ins.length-1].focus(); }
  if(a==='pick'){ modal(pickModal('')); document.getElementById('pq').focus(); }
  if(a==='pdf') makePdf();
  if(a==='copy-wa') copy(waText(S.editing));
  if(a==='to-invoice'){ await flushEdit(); modal(toInvoiceModal()); }
  if(a==='to-receipt'){ await flushEdit(); modal(receiptModal()); }
  if(a==='make-receipt'){ const inv=S.editing; const r=fromParent(inv,'receipt',{amount:+document.getElementById('ramt').value||0,date:document.getElementById('rdate').value||today(),method:document.getElementById('rmeth').value,ref:document.getElementById('rref').value});
    await persistDoc(r); closeModal(); S.editing=structuredClone(r); render(); toast('Receipt '+r.number+' issued'); }
  if(a==='del'){ if(S.armDel!==S.editing.id){S.armDel=S.editing.id; render(); return} const id=S.editing.id; S.armDel=null; S.editing=null; await removeDoc(id); S.view='docs'; render(); toast('Deleted'); }
  if(a==='export'){ try{ await saveFile('Hiprobuild backup '+today()+'.json',new Blob([JSON.stringify({app:'hiprobuild-estimator',v:1,settings:S.settings,docs:S.docs},null,1)],{type:'application/json'})); toast('Backup saved'); }catch(e){ if(!(e&&e.code==='declined')) toast('Could not save the backup. Try again.'); } }
  if(a==='signout') signOut();
  if(a==='install'&&deferredPrompt){ deferredPrompt.prompt(); try{await deferredPrompt.userChoice}catch(e){} deferredPrompt=null; render(); }
  if(a==='add-rate'){ const L=S.settings.rates; L.unshift({id:uid(),code:nextCode(L,'Other'),section:'Other',desc:'New item',unit:'item',labour:0,materials:0,rate:0}); await persistSettings(); render(); const f=document.querySelector('.rates [data-r="0"] [data-rk="desc"]'); f&&f.select(); }
  if(a==='libsave-go'&&S._lib){ const L=S.settings.rates, v=id=>document.getElementById(id).value, it=S.editing.items[S._lib.i];
    const desc=v('ls-d').trim(); if(!desc){ toast('Add an item name first.'); return }
    let r=S._lib.id?L.find(x=>x.id===S._lib.id):null; const isNew=!r;
    if(!r){ r={id:uid()}; L.push(r); }
    r.section=v('ls-s').trim()||'Other'; r.desc=desc; r.unit=v('ls-u'); r.labour=+v('ls-l')||0; r.materials=+v('ls-m')||0; r.rate=Math.round((r.labour+r.materials)*100)/100;
    let c=v('ls-c').toUpperCase().trim(); if(isNew&&c===S._lib.auto){ c=''; r.code=''; } r.code=c&&!L.some(x=>x!==r&&String(x.code).toUpperCase()===c)?c:(r.code||'');
    if(!r.code) r.code=nextCode(L,r.section); normRates(L);
    Object.assign(it,{code:r.code,section:r.section,desc:r.desc,unit:r.unit,rate:r.rate});
    S._lib=null; await persistSettings(); closeModal(); touched(true); toast(isNew?'Saved to your price library as '+r.code:'Library rate updated for '+r.code); return }
  if(a==='import-rates'){ modal(importRatesModal()); setTimeout(()=>{const t=document.getElementById('rin'); t&&t.focus()},50); }
  if(a==='rates-go'){ const err=document.getElementById('rerr'); let rows;
    try{ rows=parseRates(document.getElementById('rin').value); if(!rows.length) throw new Error('none'); }
    catch(x){ err.textContent=x.message==='nohead'?'Could not find the header row. Copy the header row too (Item, Unit, Labour, Materials).':'No items found. Paste the rows from your spreadsheet, including the header row.'; err.hidden=false; return }
    const L=document.getElementById('rreplace').checked?[]:S.settings.rates; let add=0,upd=0;
    rows.forEach(x=>{ let r=(x.code&&L.find(y=>String(y.code).toUpperCase()===x.code))||L.find(y=>y.desc.toLowerCase()===x.desc.toLowerCase());
      if(!r){ r={id:uid(),code:'',section:x.section,desc:x.desc,unit:x.unit,labour:0,materials:0,rate:0}; L.push(r); add++; } else upd++;
      r.section=x.section||r.section; r.desc=x.desc; r.unit=x.unit||r.unit; if(x.code&&!L.some(y=>y!==r&&String(y.code).toUpperCase()===x.code)) r.code=x.code;
      if(x.labour!==null||x.materials!==null){ r.labour=x.labour||0; r.materials=x.materials||0; } else if(x.total!==null){ r.labour=x.total; r.materials=0; } });
    S.settings.rates=L; normRates(L); S._codesDirty=false; await persistSettings(); closeModal(); render(); toast(add+' added, '+upd+' updated in your price library'); }
  if(a==='std-letter'&&S.editing){ S.editing.letter=fillLetter(S.editing); const t=document.getElementById('letter'); if(t) t.value=S.editing.letter; touched(); return; }
  if(a==='gpt-setup'){ if(S._codesDirty){ S._codesDirty=false; await persistSettings(); } modal(gptSetupModal(false)); }
  if(a==='gpt-copy'){ const t=document.getElementById('gptsetup'); try{ await navigator.clipboard.writeText(t.value); toast('Copied. Paste it into ChatGPT.'); closeModal(); }catch(e){ t.focus(); t.select(); toast('Select all and copy the text.'); } }
});
async function flushEdit(){ if(S.view==='edit'&&S.editing&&S.docs.some(x=>x.id===S.editing.id)){ await save(true); } }

let setT;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pq'){ const l=document.getElementById('plist'); const tmp=document.createElement('div'); tmp.innerHTML=pickModal(t.value); l.innerHTML=tmp.querySelector('#plist').innerHTML; return }
  if(S.view==='edit'&&S.editing){
    if(t.dataset.k){ let v=t.type==='checkbox'?t.checked:t.value; if(t.type==='number')v=v===''?'':+v; setPath(S.editing,t.dataset.k,v); touched(); return }
    if(t.dataset.ik){ const row=t.closest('[data-i]'), i=+row.dataset.i, it=S.editing.items[i]; it[t.dataset.ik]=t.type==='number'?(t.value===''?'':+t.value):t.value;
      const amt=document.querySelector(`[data-amt="${i}"]`); if(amt) amt.textContent=money((+it.qty||0)*(+it.rate||0)); const sl=document.querySelector(`[data-lib-slot="${i}"]`); if(sl) sl.innerHTML=libBtn(it,i); touched(); return }
  if(t.id==='ls-l'||t.id==='ls-m'){ const o=document.getElementById('ls-t'); if(o) o.textContent=money((+document.getElementById('ls-l').value||0)+(+document.getElementById('ls-m').value||0)); return }
  }
  if(t.id==='rq'){ const q=t.value.toLowerCase().trim(); document.querySelectorAll('.rates [data-r]').forEach(row=>{ row.hidden=!!q&&!row.dataset.q.includes(q); }); return }
  if(S.view==='rates'&&t.dataset.rk){ const i=+t.closest('[data-r]').dataset.r, r=S.settings.rates[i], k=t.dataset.rk;
    if(k==='labour'||k==='materials'){ r[k]=+t.value||0; r.rate=Math.round((r.labour+r.materials)*100)/100; const c=document.querySelector(`[data-rt="${i}"]`); if(c) c.textContent=money(r.rate); }
    else r[k]=k==='code'?t.value.toUpperCase().trim():t.value;
    clearTimeout(setT); setT=setTimeout(persistSettings,700); return }
  if(S.view==='settings'&&t.dataset.sk){ const k=t.dataset.sk; let v=t.type==='checkbox'?t.checked:t.value; if(['vatRate','payDays','validity','depositPct'].includes(k))v=+v||0; setPath(S.settings,k,v); clearTimeout(setT); setT=setTimeout(persistSettings,700); }
});
document.addEventListener('change',e=>{ if(e.target.matches('#status,select[data-k],input[type=checkbox][data-k],select[data-ik]')) e.target.dispatchEvent(new Event('input',{bubbles:true})) ;});
document.addEventListener('change',async e=>{ if(e.target.id!=='importfile'||!e.target.files[0])return;
  try{ const data=JSON.parse(await e.target.files[0].text()); if(!data||!Array.isArray(data.docs)) throw 0;
    if(data.settings){ S.settings=Object.assign(structuredClone(DEFAULT_SETTINGS),data.settings); await persistSettings(); }
    for(const d of data.docs){ if(d&&d.id&&d.type) await persistDoc(d); }
    toast('Restored '+data.docs.length+' documents'); render();
  }catch(err){ toast('That file is not a Hiprobuild backup. Choose the .json file you downloaded.'); }
  e.target.value=''; });
document.addEventListener('change',e=>{ if(e.target.id==='gptprices'){ document.getElementById('gptsetup').value=gptSetupText(e.target.checked); } });
document.addEventListener('change',async e=>{ if(e.target.id!=='ratefile'||!e.target.files[0])return; document.getElementById('rin').value=await e.target.files[0].text(); e.target.value=''; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- boot ---------- */
function ingest(settings,docs){ if(settings){ S.settings=Object.assign(structuredClone(DEFAULT_SETTINGS),settings); if(normRates(S.settings.rates)) S._codesDirty=true; if(migrateSettings(S.settings)){ pend.settings=Date.now(); setTimeout(lsWrite,0); } } if(docs) S.docs=docs; applyBrand(); }
document.getElementById('loginform').addEventListener('submit',async e=>{
  e.preventDefault(); const btn=e.target.querySelector('button'), err=document.getElementById('loginerr');
  err.hidden=true; btn.disabled=true; btn.textContent='Signing in…';
  try{ await signIn(document.getElementById('lemail').value.trim(),document.getElementById('lpass').value); }
  catch(x){ err.textContent=!navigator.onLine?'You are offline. Connect to the internet to sign in.':/invalid/i.test(x.message||'')?'That email or password is not right. Check them and try again.':'Could not sign in right now. Try again in a minute.'; err.hidden=false; }
  btn.disabled=false; btn.textContent='Sign in';
});
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(S.view==='settings') render(); });
(async function boot(){
  const cached=lsRead();
  if(cached){ ingest(cached.settings,cached.docs); if(cached.pend) pend=Object.assign({docs:{},del:{},settings:0},cached.pend); synced=!!cached.synced; }
  if(CFG.url&&CFG.key&&window.supabase){
    try{ sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
      const {data}=await sb.auth.getSession(); session=data.session;
      sb.auth.onAuthStateChange((ev,s)=>{ session=s; if(ev==='SIGNED_IN') scheduleSync(); });
    }catch(e){ sb=null }
  }
  S.loaded=true; applyBrand(); render(); sync();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(S.view==='edit') drawPreview(); });
  window.addEventListener('online',scheduleSync); window.addEventListener('offline',()=>setSync('off'));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleSync() });
  setInterval(()=>{ if(!document.hidden&&!syncing) sync() },60000);
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>

</body></html>
